<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <linearGradient id="fav-specular-left" x1="5" y1="4" x2="18" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#F1F5F9" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <linearGradient id="fav-silver-left" x1="10" y1="4" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>
    <linearGradient id="fav-chrome-right" x1="31" y1="6" x2="18" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F8FAFC" />
      <stop offset="50%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>
    <linearGradient id="fav-shadow-right" x1="26" y1="4" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#94A3B8" />
      <stop offset="100%" stopColor="#64748B" />
    </linearGradient>
    <linearGradient id="fav-stem-left" x1="13.5" y1="18.5" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F1F5F9" />
      <stop offset="70%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>
    <linearGradient id="fav-stem-right" x1="18" y1="18.5" x2="22.5" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>
    <linearGradient id="fav-nexus-cyan" x1="18" y1="14.5" x2="18" y2="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7dd3fc" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background obsidian plate for crisp favicon contrast in light and dark browser tabs -->
  <rect width="36" height="36" rx="8" fill="#08090d" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Monogram Facets -->
  <g transform="translate(0, 0)">
    <polygon points="5,6 10,4 18,18.5 13.5,18.5" fill="url(#fav-specular-left)" />
    <polygon points="10,4 14.5,6.5 18,12 18,18.5" fill="url(#fav-silver-left)" />
    <polygon points="18,12 21.5,6.5 26,4 18,18.5" fill="url(#fav-shadow-right)" />
    <polygon points="26,4 31,6 22.5,18.5 18,18.5" fill="url(#fav-chrome-right)" />
    <polygon points="13.5,18.5 18,18.5 18,33 14.5,30" fill="url(#fav-stem-left)" />
    <polygon points="18,18.5 22.5,18.5 21.5,30 18,33" fill="url(#fav-stem-right)" />
    <line x1="18" y1="18.5" x2="18" y2="33" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round" />
    <polygon points="18,14.5 20,17 18,19.5 16,17" fill="url(#fav-nexus-cyan)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.8" />
  </g>
</svg>